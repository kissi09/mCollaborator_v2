<style>
/* The mCollaborator "Insight" theme, lifted from backend/static/css/app.css.
   This is a prototype of a dark product, so it commits to that one world
   rather than following the viewer's theme. */
:root {
  --bg: #0F172A;
  --surface: #1E293B;
  --surface-hover: #334155;
  --text: #F8FAFC;
  --muted: #94A3B8;
  --dim: #475569;
  --border: #334155;
  --primary: #FF7900;
  --critical: #EF4444;
  --high: #F59E0B;
  --medium: #3B82F6;
  --low: #22C55E;
  --ok: #22C55E;
  --radius: 8px;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- prototype chrome (not part of the app) ---- */
.chrome {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
  padding: 14px 24px;
  background: #0B1120;
  border-bottom: 1px solid var(--border);
}
.chrome-title {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.9px; text-transform: uppercase; color: var(--dim);
}
.tabs { display: flex; gap: 4px; }
.tab {
  height: 32px; padding: 0 14px; border-radius: 6px; cursor: pointer;
  font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
  background: transparent; border: 1px solid transparent; color: var(--muted);
  transition: color .15s, background .15s;
}
.tab:hover { color: var(--text); background: var(--surface); }
.tab[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--bg); }
.chrome-note { font-size: 12px; color: var(--dim); max-width: 46ch; line-height: 1.5; }

.stage { padding: 24px; display: flex; justify-content: center; }
.frame {
  width: 100%; max-width: 1440px;
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background: var(--bg);
  box-shadow: 0 24px 60px rgba(0,0,0,0.45);
}

/* ---- app primitives, exact values from app.css ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 16px; border-radius: var(--radius); cursor: pointer;
  font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
  border: 1px solid transparent; white-space: nowrap; transition: all .15s;
}
.btn-primary { background: var(--primary); color: var(--bg); }
.btn-primary:hover { opacity: .9; }
.btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--text); background: var(--surface-hover); }
.btn[disabled] { background: var(--surface); border-color: var(--border); color: var(--dim); cursor: default; opacity: 1; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.navbar {
  height: 64px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 16px;
}
.nav-title { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--primary); }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link { padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--muted); border-radius: 6px; }
.nav-link.active { background: var(--primary); color: var(--bg); font-weight: 600; }

.eyebrow {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted);
}
.mono { font-family: var(--font-mono); }
.chip {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.pill {
  display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: var(--radius);
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}

.screen { display: flex; flex-direction: column; height: 900px; overflow: hidden; }
.split { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.rail { width: 300px; flex-shrink: 0; overflow-y: auto; padding: 20px 16px; }
.rail-l { border-right: 1px solid var(--border); }
.rail-r { border-left: 1px solid var(--border); }
.rail h4 { margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.topbar {
  flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
}
.topbar h1 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.2px; }

/* ---- workspace ---- */
.filters { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border-radius: var(--radius); cursor: pointer;
  font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .3px;
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  transition: all .15s;
}
.fchip:hover { color: var(--text); border-color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--bg); }
.fchip .n {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  padding: 0 4px; border-radius: 4px; background: var(--bg); color: var(--muted);
}
.fchip[aria-pressed="true"] .n { background: rgba(15,23,42,.22); color: var(--bg); }

.group { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.group + .group { margin-top: 14px; }
.group-head {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 16px; cursor: pointer; background: transparent;
  border: 0; color: inherit; text-align: left; font: inherit;
}
.group-head:hover { background: rgba(15,23,42,.35); }
.group-head .chev { transition: transform .15s; flex-shrink: 0; }
.group[data-open="false"] .chev { transform: rotate(0deg); }
.group[data-open="true"] .chev { transform: rotate(90deg); }
.group[data-open="false"] .group-body { display: none; }
.group-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; }
.group-code {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .5px;
  color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
}

.row { display: flex; gap: 14px; padding: 13px 16px; border-top: 1px solid var(--border); align-items: flex-start; }
.score {
  flex-shrink: 0; width: 46px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius); font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.row-title { font-size: 13px; font-weight: 600; }
.row-host { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 3px 0 7px; }
.checks { display: flex; gap: 6px; flex-wrap: wrap; }
.check {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px 1px 5px; border-radius: 4px; font-size: 10.5px;
}
.check.ok { color: var(--ok); background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.22); }
.check.gap { color: var(--high); background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.22); }

.meter { height: 4px; border-radius: 2px; background: var(--bg); overflow: hidden; }
.meter span { display: block; height: 100%; }

/* ---- import ---- */
.modal-stage { flex: 1; display: flex; align-items: center; justify-content: center; background: rgba(15,23,42,.86); padding: 24px; }
.modal { width: 720px; max-width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.srctabs { display: flex; gap: 24px; padding: 0 24px; border-bottom: 1px solid var(--border); }
.srctab {
  background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  padding: 12px 2px; cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted);
}
.srctab:hover { color: var(--text); }
.srctab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.dropzone {
  border: 2px dashed var(--muted); border-radius: var(--radius); padding: 40px;
  text-align: center; cursor: pointer; transition: all .2s; background: transparent;
  width: 100%; color: inherit; font: inherit;
}
.dropzone:hover { border-color: var(--primary); background: rgba(255,121,0,.05); }
.dropzone h4 { margin: 10px 0 4px; font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.dropzone p { margin: 0; font-size: 13px; color: var(--muted); }
.notice { display: flex; gap: 12px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12.5px; line-height: 1.7; color: var(--muted); }
.filecard { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); }
.sweep { height: 4px; border-radius: 2px; background: var(--bg); overflow: hidden; position: relative; }
.sweep i { position: absolute; inset: 0; width: 30%; background: var(--primary); animation: sweep 1.1s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.steps { display: flex; flex-direction: column; gap: 9px; }
.step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
.step .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
.bucket { display: flex; align-items: center; gap: 10px; }
.bucket .code { width: 42px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
.bucket .track { flex: 1; height: 18px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bucket .track span { display: block; height: 100%; border-radius: 4px; }
.bucket .note { width: 130px; font-size: 11.5px; color: var(--muted); }
.code-sample { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.75; color: var(--muted); overflow-x: auto; }
.code-sample .k { color: #7DD3FC; }
.code-sample .s { color: #FDBA74; }

/* ---- review board ---- */
.board { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 20px 24px 24px; min-height: 0; }
.board-inner { display: flex; gap: 14px; height: 100%; align-items: stretch; }
.col {
  width: 240px; flex-shrink: 0; display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
  transition: border-color .12s, background .12s;
}
.col[data-pen="true"] { border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.05); }
.col.is-over { border-color: var(--primary); background: rgba(255,121,0,.07); }
.col-head { padding: 12px 13px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.col-head .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.col-code { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; letter-spacing: .4px; }
.col-count {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 5px;
  border-radius: 4px; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  color: var(--muted); background: var(--surface); border: 1px solid var(--border);
}
.col-count.warn { color: var(--high); background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.3); }
.col-label { font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.col-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 9px; }

.fcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 11px; cursor: grab; user-select: none;
  transition: border-color .12s, opacity .12s, box-shadow .12s;
}
.fcard:hover { border-color: var(--muted); }
.fcard.is-dragging { opacity: .4; border-color: var(--primary); }
.fcard .grip { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.fcard .ref { font-family: var(--font-mono); font-size: 10px; color: var(--dim); margin-left: auto; }
.fcard .t { font-size: 12.5px; font-weight: 600; line-height: 1.45; margin-bottom: 5px; }
.fcard .h { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
.why { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 9px; font-size: 10.5px; line-height: 1.45; }
.why.sure { color: var(--muted); }
.why.unsure { color: var(--high); }
.fcard select {
  width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius); padding: 5px 8px; font-size: 11px; font-family: var(--font-body);
  outline: none; cursor: pointer;
}
.fcard select.unset { border-color: rgba(245,158,11,.45); color: var(--high); }
.dropslot {
  border: 1px dashed var(--primary); border-radius: var(--radius); padding: 20px 12px;
  text-align: center; font-size: 11.5px; font-weight: 600; color: var(--primary); background: rgba(255,121,0,.06);
}

}
.hintbar { flex-shrink: 0; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
</style>

<script>

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function esc(s) {
  return String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
}
function sevStyle(sev, size) {
  const c = SEV[sev];
  return `color:${c};background:${rgba(c, .15)};border:1px solid ${rgba(c, .3)};${size ? `font-size:${size};` : ''}`;

const state = {
  screen: 'workspace',
  sev: 'all',
  gaps: false,
  closed: {},
  tab: 'doc',
  phase: 'idle',

};
let timer = null;

/* ---------- screen 1: project workspace ---------- */
function navbar() {
  const links = ['Dashboard', 'Projects', 'Findings', 'Evidence', 'Reports', 'Users', 'Closure Prep'];
  return `<div class="navbar">
    <div style="display:flex;align-items:center;gap:24px;">
      <div style="display:flex;align-items:center;gap:8px;">${ICON.mark}<span class="nav-title">mCollaborator</span></div>

        `<span class="nav-link${l === 'Projects' ? ' active' : ''}">${l}</span>`).join('')}</div>
    </div>
    <span style="font-size:13px;color:var(--muted);">Emmanuel Addo Kissi</span>
  </div>`;
}

function workspace() {
  const counts = { all: FINDINGS.length };
  SEV_ORDER.forEach(s => counts[s] = FINDINGS.filter(f => f.severity === s).length);
  const gapCount = FINDINGS.filter(f => !f.evidence || !f.rec || !f.hasHost).length;

  const visible = FINDINGS.filter(f =>
    (state.sev === 'all' || f.severity === state.sev) &&
    (!state.gaps || !(f.evidence && f.rec && f.hasHost)));

  const chips = [{ k: 'all', l: 'All' }]
    .concat(SEV_ORDER.filter(s => counts[s]).map(s => ({ k: s, l: s[0].toUpperCase() + s.slice(1) })))
    .map(c => `<button class="fchip" data-sev="${c.k}" aria-pressed="${state.sev === c.k}">${c.l}<span class="n">${counts[c.k]}</span></button>`)
    .join('');

  const groups = SCOPE.map(([code, label]) => {
    const all = FINDINGS.filter(f => f.area === code);
    const items = visible.filter(f => f.area === code);
    if (!all.length === false && !items.length && (state.sev !== 'all' || state.gaps)) return '';
    const open = !state.closed[code];

    const dots = SEV_ORDER.map(s => ({ s, n: all.filter(f => f.severity === s).length }))
      .filter(d => d.n)
      .map(d => `<span class="chip" style="${sevStyle(d.s)}min-width:20px;justify-content:center;">${d.n}</span>`)
      .join('');

    const rows = items.map(f => {
      const checks = [
        { ok: f.hasHost, l: 'affected host' },
        { ok: f.rec, l: 'recommendation' },
        { ok: f.evidence, l: 'evidence' }
      ].map(c => `<span class="check ${c.ok ? 'ok' : 'gap'}">${c.ok ? ICON.check : ICON.dash}${c.l}</span>`).join('');
      const st = f.status === 'draft'
        ? 'color:#8B5CF6;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);'
        : f.status === 'in progress'
          ? 'color:var(--primary);background:rgba(255,121,0,.15);border:1px solid rgba(255,121,0,.3);'
          : 'color:var(--critical);background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);';
      return `<div class="row">
        <div class="score" style="${sevStyle(f.severity)}">${f.score || '&mdash;'}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="row-title">${esc(f.title)}</span>
            <span class="chip" style="${sevStyle(f.severity)}">${f.severity}</span>
          </div>
          <div class="row-host">${esc(f.host) || 'No affected host recorded'}</div>
          <div class="checks">${checks}</div>
        </div>
        <span class="pill" style="${st}flex-shrink:0;">${f.status}</span>
      </div>`;
    }).join('');

    const empty = all.length === 0
      ? `<div style="padding:16px;border-top:1px solid var(--border);font-size:12px;line-height:1.7;color:var(--muted);">
           No findings recorded. This section will print
           <span style="color:var(--text);">&ldquo;No security issues were identified during the ${esc(label)}.&rdquo;</span>
         </div>` : '';

    return `<div class="group" data-open="${open}">
      <button class="group-head" data-group="${code}">
        ${ICON.chev}
        <span class="group-name">${esc(label)}</span>
        <span class="group-code">${code}</span>
        <span style="flex:1;"></span>
        <span style="display:flex;gap:3px;">${dots}</span>
        <span style="font-size:12px;color:var(--muted);min-width:74px;text-align:right;">${all.length} finding${all.length === 1 ? '' : 's'}</span>
      </button>
      <div class="group-body">${rows}${empty}</div>
    </div>`;
  }).join('');

  const withEvidence = FINDINGS.filter(f => f.evidence).length;
  const withRec = FINDINGS.filter(f => f.rec).length;
  const withHost = FINDINGS.filter(f => f.hasHost).length;
  const meter = (n, c) => `<div class="meter"><span style="width:${Math.round(n / FINDINGS.length * 100)}%;background:${c};"></span></div>`;
  const ready = [
    ['Affected host recorded', withHost, 'var(--ok)', 'Prints as the affected row in every section.'],
    ['Recommendation written', withRec, 'var(--high)', 'One finding would print an empty recommendation.'],
    ['Evidence attached', withEvidence, 'var(--high)', 'Only these get a scenario slide in the closing deck.']
  ].map(([l, n, c, note]) => `<div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;">
        <span style="font-size:12px;">${l}</span>
        <span class="mono" style="font-size:11px;color:${c};">${n} of ${FINDINGS.length}</span>
      </div>
      ${meter(n, c)}
      <div style="font-size:11px;line-height:1.6;color:var(--muted);margin-top:5px;">${note}</div>
    </div>`).join('');

  return `<div class="screen">
    ${navbar()}
    <div class="topbar">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <h1>Acme Test Bank</h1>
          <span class="pill" style="height:24px;color:var(--primary);background:rgba(255,121,0,.15);border:1px solid rgba(255,121,0,.3);">active</span>
        </div>
        <div class="mono" style="display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;">
          <span>TEST-REP-001-00000-01</span><span style="color:var(--border);">|</span>
          <span>17 Aug &ndash; 28 Aug 2026</span><span style="color:var(--border);">|</span>
          <span>6 areas in scope</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="btn btn-secondary" data-goto="import">${ICON.upload}Import findings</button>
        <button class="btn btn-secondary">${ICON.plus}New finding</button>
        <button class="btn btn-primary">Generate report</button>
      </div>
    </div>
    <div class="split">
      <div class="rail rail-l">
        <h4 class="eyebrow">Scope &amp; targets</h4>
        <div style="display:flex;flex-direction:column;gap:14px;">
          ${SCOPE.map(([code, label, text]) => `<div>
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;">
              <span style="font-size:12px;font-weight:600;">${esc(label)}</span>
              <span class="mono" style="font-size:10px;color:var(--muted);">${code}</span>
            </div>
            <div class="mono" style="font-size:11px;line-height:1.6;color:var(--muted);">${esc(text)}</div>
          </div>`).join('')}
        </div>
      </div>
      <div style="flex:1;min-width:0;overflow-y:auto;padding:20px 24px 48px;">
        <div class="filters">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${chips}</div>
          <button class="fchip" id="gapbtn" aria-pressed="${state.gaps}">${ICON.warn}${state.gaps ? `Showing ${gapCount} needing attention` : `${gapCount} need attention`}</button>
        </div>
        ${groups}
      </div>
      <div class="rail rail-r">
        <h4 class="eyebrow">Report readiness</h4>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:26px;">${ready}</div>
        <h4 class="eyebrow">Project</h4>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${[['Client', 'Acme Test Bank'], ['Methodology', 'PTES'], ['Lead', 'Emmanuel Addo Kissi'], ['Last report', 'Not generated yet']]
            .map(([k, v]) => `<div>
              <div style="font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px;">${k}</div>
              <div style="font-size:13px;">${v}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- screen 2: import ---------- */
function importScreen() {
  const doc = state.tab === 'doc';
  let body = '';

  if (!doc) {
    body = `<p style="margin:0 0 10px;font-size:12.5px;line-height:1.7;color:var(--muted);">
        A JSON array of findings. Each needs <span class="mono" style="color:var(--text);">title</span>,
        <span class="mono" style="color:var(--text);">severity</span> and
        <span class="mono" style="color:var(--text);">description</span>; everything else is optional.</p>
      <div class="code-sample">[<br>
        &nbsp;&nbsp;{ <span class="k">"title"</span>: <span class="s">"SMB signing not required"</span>,<br>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="k">"severity"</span>: <span class="s">"high"</span>,<br>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="k">"category"</span>: <span class="s">"IPT"</span>,<br>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="k">"description"</span>: <span class="s">"Unsigned SMB accepted."</span> }<br>
      ]</div>
      <div style="margin-top:10px;font-size:11.5px;color:var(--muted);">Pasted findings go through the same review step.</div>`;
  } else if (state.phase === 'idle') {
    body = `<button class="dropzone" id="dropzone">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M3.5 16v2.5a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V16"/></svg>
        <h4>Drop a report here</h4>
        <p>or click to browse &middot; DOCX or PDF only, up to 25&nbsp;MB</p>
      </button>
      <div class="notice" style="margin-top:18px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v4"/><path d="M8 4.9v.01"/></svg>
        <div>Findings are read out of the document and sorted into assessment areas by their section headings, and by the wording of each finding where a heading does not say.
          <span style="color:var(--text);">Nothing is saved until you have reviewed the sorting.</span></div>
      </div>`;
  } else if (state.phase === 'busy') {
    const steps = [['Reading the document structure', true], ['Finding the vulnerability blocks', true], ['Sorting them into assessment areas', false]];
    body = `<div class="filecard">
        <span style="color:var(--primary);flex-shrink:0;">${ICON.doc}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;margin-bottom:2px;">Acme Test Bank &mdash; VAPT.docx</div>
          <div class="mono" style="font-size:11px;color:var(--muted);">566 KB &middot; 48 pages</div>
        </div>
        <span class="mono" style="font-size:11px;color:var(--primary);">Reading&hellip;</span>
      </div>
      <div class="sweep" style="margin-top:14px;"><i></i></div>
      <div class="steps" style="margin-top:20px;">
        ${steps.map(([l, done]) => `<div class="step" style="color:${done ? 'var(--ok)' : 'var(--muted)'};">${done ? ICON.check : '<span class="dot"></span>'}${l}</div>`).join('')}
      </div>`;
  } else {
    const buckets = [['IPT', 2, 'from heading 3.3'], ['EPT', 2, 'from heading 3.5'], ['WPT', 2, 'from heading 3.6'],
      ['CFG', 2, 'from heading 3.7'], ['ADT', 1, 'from wording', true], ['&mdash;', 2, 'no clear match', true]];
    body = `<div class="filecard" style="border-color:rgba(34,197,94,.3);">
        ${ICON.docOk}
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;margin-bottom:2px;">Acme Test Bank &mdash; VAPT.docx</div>
          <div class="mono" style="font-size:11px;color:var(--muted);">11 findings read &middot; 6 assessment areas &middot; 2 need a second look</div>
        </div>
        <button class="btn btn-secondary btn-sm" id="replace">Replace</button>
      </div>
      <div style="margin-top:18px;">
        <div class="eyebrow" style="margin-bottom:10px;">How they sorted</div>
        <div style="display:flex;flex-direction:column;gap:7px;">
          ${buckets.map(([c, n, note, low]) => `<div class="bucket">
            <span class="code" style="color:${low ? 'var(--high)' : 'var(--text)'};">${c}</span>
            <div class="track"><span style="width:${Math.round(n / 3 * 100)}%;background:${low ? 'rgba(245,158,11,.55)' : 'var(--primary)'};"></span></div>
            <span class="note">${note}</span>
          </div>`).join('')}
        </div>
      </div>`;
  }

  const ready = doc ? state.phase === 'done' : true;
  const foot = doc
    ? (state.phase === 'done' ? '2 findings could not be placed with confidence' : 'DOCX and PDF only')
    : 'Pasted findings are reviewed the same way';

  return `<div class="screen">
    ${navbar()}
    <div class="modal-stage">
      <div class="modal">
        <div class="modal-head">
          <h3>Import findings</h3>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </div>
        <div class="srctabs">
          <button class="srctab" data-src="doc" aria-selected="${doc}">From a document</button>
          <button class="srctab" data-src="json" aria-selected="${!doc}">Paste JSON</button>
        </div>
        <div style="padding:24px;">${body}</div>
        <div class="modal-foot">
          <span style="font-size:12px;color:var(--muted);">${foot}</span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost">Cancel</button>
            <button class="btn btn-primary" ${ready ? 'data-goto="review"' : 'disabled'}>${ready && doc ? 'Review 11 findings' : 'Review findings'}</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- screen 3: review board ---------- */
function reviewScreen() {
  const unsorted = state.cards.filter(c => !c.area).length;
  const codes = ['', 'IPT', 'EPT', 'WPT', 'CFG', 'ADT', 'NAR'];

  const cols = codes.map(code => {
    const pen = code === '';
    const mine = state.cards.filter(c => c.area === code);
    const cards = mine.map(f => {
      const opts = [{ code: '', label: 'Choose an area…' }].concat(AREAS)
        .map(o => `<option value="${o.code}"${o.code === f.area ? ' selected' : ''}>${esc(o.label)}</option>`).join('');
      const sure = f.sure || f.moved;
      return `<div class="fcard" draggable="true" data-id="${f.id}">
        <div class="grip">${ICON.grip}<span class="chip" style="${sevStyle(f.severity)}font-size:9.5px;">${f.severity}</span><span class="ref">${f.ref}</span></div>
        <div class="t">${esc(f.title)}</div>
        <div class="h">${esc(f.host) || 'no host recorded'}</div>
        <div class="why ${sure ? 'sure' : 'unsure'}">
          <span style="flex-shrink:0;margin-top:1px;color:${sure ? 'var(--ok)' : 'var(--high)'};">${sure ? ICON.check : ICON.warn}</span>
          <span>${f.moved ? 'Moved by you' : esc(f.why)}</span>
        </div>
        <select data-id="${f.id}" class="${f.area ? '' : 'unset'}" aria-label="Assessment area">${opts}</select>
      </div>`;
    }).join('');

    const empty = mine.length ? '' :
      `<div class="emptyslot">${pen ? 'Everything found a home' : 'Nothing sorted here'}</div>`;

    return `<div class="col" data-code="${code}" data-pen="${pen}">
      <div class="col-head">
        <div class="top">
          <span class="col-code" style="color:${pen ? 'var(--high)' : 'var(--text)'};">${pen ? 'Needs a category' : code}</span>
          <span class="col-count${pen && mine.length ? ' warn' : ''}">${mine.length}</span>
        </div>
        <div class="col-label">${pen ? 'Nothing in the document said where these belong' : esc(areaLabel(code))}</div>
      </div>
      <div class="col-body">${cards}${empty}</div>
    </div>`;
  }).join('');

  const warn = unsorted === 0
    ? 'color:var(--ok);background:rgba(34,197,94,.13);border:1px solid rgba(34,197,94,.3);'
    : 'color:var(--high);background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.3);';

  return `<div class="screen">
    <div class="topbar">
      <div>
        <h1 style="margin-bottom:6px;">Review extracted findings</h1>
        <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h7l5 5v14H6z"/><path d="M13 2.5v5h5"/></svg>
          <span class="mono" style="font-size:12px;">Acme Test Bank &mdash; VAPT.docx</span>
          <span style="color:var(--border);">|</span>
          <span>${state.cards.length} findings read</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <span class="pill" style="height:26px;${warn}">${unsorted === 0 ? 'Every finding has an area' : unsorted + ' still need a category'}</span>
        <button class="btn btn-secondary" data-goto="import">Discard</button>
        <button class="btn btn-primary" ${unsorted === 0 ? '' : 'disabled'}>Import ${state.cards.length} findings</button>
      </div>
    </div>
    <div class="hintbar">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><path d="M2.5 8h4l1.5-3 2 6 1.5-3h2"/></svg>
      Each finding was placed by its section heading, or by its wording where the heading did not say. Drag a card into another column, or set its area on the card &mdash; whichever is quicker.
    </div>
    <div class="board"><div class="board-inner">${cols}</div></div>
  </div>`;
}

/* ---------- wiring ---------- */
const frame = document.getElementById('frame');

function render() {
  frame.innerHTML = state.screen === 'workspace' ? workspace()
    : state.screen === 'import' ? importScreen() : reviewScreen();
  document.querySelectorAll('#tabs .tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.screen === state.screen)));
  document.getElementById('chrome-note').textContent = NOTES[state.screen];
  if (state.screen === 'review') wireDrag();
}

function go(screen) {
  state.screen = screen;
  if (screen === 'import' && state.phase === 'busy') state.phase = 'idle';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) go(t.dataset.screen);
});

frame.addEventListener('click', e => {
  const goBtn = e.target.closest('[data-goto]');
  if (goBtn) { go(goBtn.dataset.goto); return; }

  const chip = e.target.closest('[data-sev]');
  if (chip) { state.sev = state.sev === chip.dataset.sev ? 'all' : chip.dataset.sev; render(); return; }

  if (e.target.closest('#gapbtn')) { state.gaps = !state.gaps; render(); return; }

  const head = e.target.closest('[data-group]');
  if (head) { const c = head.dataset.group; state.closed[c] = !state.closed[c]; render(); return; }

  const src = e.target.closest('[data-src]');
  if (src) { state.tab = src.dataset.src; render(); return; }

  if (e.target.closest('#dropzone')) {
    state.phase = 'busy';
    render();
    clearTimeout(timer);
    timer = setTimeout(() => { state.phase = 'done'; render(); }, 1500);
    return;
  }
  if (e.target.closest('#replace')) { state.phase = 'idle'; render(); }
});

frame.addEventListener('change', e => {
  const sel = e.target.closest('select[data-id]');
  if (!sel) return;
  move(Number(sel.dataset.id), sel.value);
});

function move(id, area) {
  const card = state.cards.find(c => c.id === id);
  if (!card || card.area === area) return;
  card.area = area;
  card.moved = true;
  render();
}

// Drag state lives on the DOM during a drag: re-rendering mid-drag would tear
// the dragged node out from under the pointer and cancel it.
function wireDrag() {
  frame.querySelectorAll('.fcard').forEach(card => {
    card.addEventListener('dragstart', e => {
      state.dragging = Number(card.dataset.id);
      card.classList.add('is-dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch (_) {}
      }
    });
    card.addEventListener('dragend', () => {
      state.dragging = null;
      card.classList.remove('is-dragging');
      frame.querySelectorAll('.col.is-over').forEach(c => c.classList.remove('is-over'));
      frame.querySelectorAll('.dropslot').forEach(s => s.remove());
    });
  });

  frame.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      if (col.classList.contains('is-over')) return;
      col.classList.add('is-over');
      const holds = state.cards.some(c => c.id === state.dragging && c.area === col.dataset.code);
      if (!holds && !col.querySelector('.dropslot')) {
        const slot = document.createElement('div');
        slot.className = 'dropslot';
        slot.textContent = 'Drop here';
        col.querySelector('.col-body').appendChild(slot);
        const e2 = col.querySelector('.emptyslot');
        if (e2) e2.remove();
      }
    });
    col.addEventListener('dragleave', e => {
      if (col.contains(e.relatedTarget)) return;
      col.classList.remove('is-over');
      const slot = col.querySelector('.dropslot');
      if (slot) slot.remove();
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('is-over');
      if (state.dragging !== null) move(state.dragging, col.dataset.code);
    });
  });
}

render();
</script>
